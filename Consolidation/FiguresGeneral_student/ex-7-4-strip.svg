<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="280" height="175" font-family="'Times New Roman', Times, serif" font-size="20">
  <!-- Example 7.4: half of the strip load (width B/2, beta = 0) and the point at
       depth z under the centre line. By symmetry, I' for the full strip is twice this. -->
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#ff0000" stroke-width="2"/>
    </marker>
  </defs>

  <!-- dimension B/2 -->
  <path d="M50,10 v12 M50,16 H180 M180,10 v12" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="13" font-size="16" font-style="italic">B/2</text>

  <!-- load -->
  <g stroke="#ff0000" stroke-width="2.5" fill="none">
    <line x1="50" y1="28" x2="180" y2="28"/>
    <line x1="52" y1="28" x2="52" y2="54" marker-end="url(#dn)"/>
    <line x1="84" y1="28" x2="84" y2="54" marker-end="url(#dn)"/>
    <line x1="116" y1="28" x2="116" y2="54" marker-end="url(#dn)"/>
    <line x1="148" y1="28" x2="148" y2="54" marker-end="url(#dn)"/>
    <line x1="178" y1="28" x2="178" y2="54" marker-end="url(#dn)"/>
  </g>
  <text x="196" y="44" fill="#ff0000" font-style="italic">β = 0</text>

  <!-- ground surface -->
  <line x1="10" y1="56" x2="270" y2="56" stroke="#000" stroke-width="2.5"/>

  <!-- geometry -->
  <line x1="50" y1="56" x2="180" y2="160" stroke="#000" stroke-width="1.5"/>
  <line x1="180" y1="56" x2="180" y2="160" stroke="#000" stroke-width="1.5"/>
  <path d="M174,160 h12" stroke="#000" stroke-width="1.5"/>
  <text x="188" y="116" font-style="italic">z</text>
  <path d="M180,118 A42,42 0 0,0 147.2,133.8" fill="none" stroke="#008000" stroke-width="2"/>
  <text x="162" y="145" font-size="18" font-style="italic" fill="#008000">α</text>
  <circle cx="180" cy="160" r="4" fill="#000"/>
</svg>
