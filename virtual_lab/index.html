<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Soil Lab</title>
  <link rel="stylesheet" href="core/vlab.css">
  <style>
    .vl-landing { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
    .vl-landing h1 { margin: 0 0 4px; font-size: 24px; }
    .vl-landing > p { color: var(--vl-muted); margin: 0 0 20px; }
    .vl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .vl-card {
      display: block; padding: 14px 16px; border: 1px solid var(--vl-line); border-radius: 10px;
      background: var(--vl-panel); color: inherit; text-decoration: none;
    }
    .vl-card:hover { border-color: var(--vl-accent); }
    .vl-card h2 { margin: 0 0 4px; font-size: 16px; }
    .vl-card p { margin: 0; color: var(--vl-muted); font-size: 13px; }
    .vl-card.vl-soon { opacity: .55; pointer-events: none; }
  </style>
</head>
<body>
  <main class="vl-landing">
    <h1>Virtual Soil Lab</h1>
    <p>CIE 365 Soil Mechanics. Interactive models that run entirely in your browser.</p>
    <div class="vl-cards">
      <a class="vl-card" href="experiments/sheetpile/index.html">
        <h2>Seepage under a sheet pile</h2>
        <p>2D Laplace equation: total head, flow net, exit gradient and virtual standpipes.</p>
      </a>
      <div class="vl-card vl-soon">
        <h2>Constant / falling head permeameter</h2>
        <p>Coming later.</p>
      </div>
    </div>
  </main>
</body>
</html>
